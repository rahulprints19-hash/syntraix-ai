services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: syntrix-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Syntrix AI}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/v1/chat/ws}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: syntrix-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SYNTRIX_PROJECT_NAME: ${SYNTRIX_PROJECT_NAME:-Syntrix AI API}
      SYNTRIX_ENVIRONMENT: ${SYNTRIX_ENVIRONMENT:-development}
      SYNTRIX_DEBUG: ${SYNTRIX_DEBUG:-true}
      SYNTRIX_SQL_ECHO: ${SYNTRIX_SQL_ECHO:-false}
      SYNTRIX_DATABASE_URL: ${SYNTRIX_DATABASE_URL:-postgresql+asyncpg://syntrix:syntrix@postgres:5432/syntrix}
      SYNTRIX_REDIS_URL: ${SYNTRIX_REDIS_URL:-redis://redis:6379/0}
      SYNTRIX_CORS_ORIGINS: "${SYNTRIX_CORS_ORIGINS:-http://localhost:3000}"
      SYNTRIX_OPENAI_API_KEY: ${SYNTRIX_OPENAI_API_KEY:-}
      SYNTRIX_OPENAI_MODEL: ${SYNTRIX_OPENAI_MODEL:-gpt-5.4-mini}
      SYNTRIX_ADMIN_EMAILS: ${SYNTRIX_ADMIN_EMAILS:-}
      SYNTRIX_STRIPE_SECRET_KEY: ${SYNTRIX_STRIPE_SECRET_KEY:-}
      SYNTRIX_STRIPE_PRICE_FREE: ${SYNTRIX_STRIPE_PRICE_FREE:-}
      SYNTRIX_STRIPE_PRICE_PRO: ${SYNTRIX_STRIPE_PRICE_PRO:-}
      SYNTRIX_STRIPE_PRICE_SCALE: ${SYNTRIX_STRIPE_PRICE_SCALE:-}
      SYNTRIX_STRIPE_SUCCESS_URL: ${SYNTRIX_STRIPE_SUCCESS_URL:-http://localhost:3000?billing=success}
      SYNTRIX_STRIPE_CANCEL_URL: ${SYNTRIX_STRIPE_CANCEL_URL:-http://localhost:3000?billing=cancelled}
      SYNTRIX_RAZORPAY_KEY_ID: ${SYNTRIX_RAZORPAY_KEY_ID:-}
      SYNTRIX_RAZORPAY_KEY_SECRET: ${SYNTRIX_RAZORPAY_KEY_SECRET:-}
      SYNTRIX_RAZORPAY_CALLBACK_URL: ${SYNTRIX_RAZORPAY_CALLBACK_URL:-http://localhost:3000?billing=razorpay}
      SYNTRIX_LOG_LEVEL: ${SYNTRIX_LOG_LEVEL:-INFO}
      SYNTRIX_SECRET_KEY: ${SYNTRIX_SECRET_KEY:-dev-change-me-32-bytes-minimum-secret-key}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: syntrix-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syntrix}
      POSTGRES_USER: ${POSTGRES_USER:-syntrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syntrix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syntrix} -d ${POSTGRES_DB:-syntrix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: syntrix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
