[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syntrix-backend"
version = "0.1.0"
description = "FastAPI backend for Syntrix AI"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic>=1.14.0,<2.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "fastapi==0.136.1",
  "greenlet>=3.1.0,<4.0.0",
  "orjson>=3.10.0,<4.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "PyJWT>=2.9.0,<3.0.0",
  "cryptography>=43.0.0,<47.0.0",
  "httpx>=0.28.0,<1.0.0",
  "openai>=1.109.0,<2.0.0",
  "redis[hiredis]>=6.0.0,<7.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "ruff>=0.11.0,<1.0.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
