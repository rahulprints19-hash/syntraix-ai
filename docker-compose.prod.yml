services:
  nginx:
    image: nginx:1.29-alpine
    container_name: syntrix-nginx
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.prod.Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Syntrix AI}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/api/v1/chat/ws}
    container_name: syntrix-frontend-prod
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Syntrix AI}
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/api/v1/chat/ws}

  backend:
    build:
      context: .
      dockerfile: docker/backend.prod.Dockerfile
    container_name: syntrix-backend-prod
    environment:
      SYNTRIX_PROJECT_NAME: ${SYNTRIX_PROJECT_NAME:-Syntrix AI API}
      SYNTRIX_ENVIRONMENT: production
      SYNTRIX_DEBUG: false
      SYNTRIX_SQL_ECHO: false
      SYNTRIX_DATABASE_URL: ${SYNTRIX_DATABASE_URL:-postgresql+asyncpg://syntrix:syntrix@postgres:5432/syntrix}
      SYNTRIX_REDIS_URL: ${SYNTRIX_REDIS_URL:-redis://redis:6379/0}
      SYNTRIX_CORS_ORIGINS: "${SYNTRIX_CORS_ORIGINS:-http://localhost}"
      SYNTRIX_OPENAI_API_KEY: ${SYNTRIX_OPENAI_API_KEY:-}
      SYNTRIX_OPENAI_MODEL: ${SYNTRIX_OPENAI_MODEL:-gpt-5.4-mini}
      SYNTRIX_ADMIN_EMAILS: ${SYNTRIX_ADMIN_EMAILS:?Set SYNTRIX_ADMIN_EMAILS for production admin access}
      SYNTRIX_STRIPE_SECRET_KEY: ${SYNTRIX_STRIPE_SECRET_KEY:-}
      SYNTRIX_STRIPE_PRICE_FREE: ${SYNTRIX_STRIPE_PRICE_FREE:-}
      SYNTRIX_STRIPE_PRICE_PRO: ${SYNTRIX_STRIPE_PRICE_PRO:-}
      SYNTRIX_STRIPE_PRICE_SCALE: ${SYNTRIX_STRIPE_PRICE_SCALE:-}
      SYNTRIX_STRIPE_SUCCESS_URL: ${SYNTRIX_STRIPE_SUCCESS_URL:-http://localhost?billing=success}
      SYNTRIX_STRIPE_CANCEL_URL: ${SYNTRIX_STRIPE_CANCEL_URL:-http://localhost?billing=cancelled}
      SYNTRIX_RAZORPAY_KEY_ID: ${SYNTRIX_RAZORPAY_KEY_ID:-}
      SYNTRIX_RAZORPAY_KEY_SECRET: ${SYNTRIX_RAZORPAY_KEY_SECRET:-}
      SYNTRIX_RAZORPAY_CALLBACK_URL: ${SYNTRIX_RAZORPAY_CALLBACK_URL:-http://localhost?billing=razorpay}
      SYNTRIX_LOG_LEVEL: ${SYNTRIX_LOG_LEVEL:-INFO}
      SYNTRIX_SECRET_KEY: ${SYNTRIX_SECRET_KEY:?Set SYNTRIX_SECRET_KEY before starting production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: syntrix-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syntrix}
      POSTGRES_USER: ${POSTGRES_USER:-syntrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syntrix}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syntrix} -d ${POSTGRES_DB:-syntrix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: syntrix-redis-prod
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
  redis_prod_data:
